name: Refresh community data and deploy

on:
  schedule:
    # 01:00 UTC = 10:00 KST, every day.
    - cron: '0 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: community-monitor-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Collect public posts
        run: python server.py --refresh-only
      - name: Save latest data in the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest-cache.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh community data"
            git push
          fi
      - name: Prepare static site
        run: |
          mkdir public
          cp index.html latest-cache.json public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
